<title>AR Electric</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap">
<style>
:root{
  /* Layout: sticky violet header with a tab bar, one tab shown at a time; purple brushed-metal panels, gold/orange metal rounded rectangles for actions and numbers. */
  --ink:#f5f0ff; --ink-2:#d2c6ee; --ink-3:#a595cf;
  --v950:#0f0520; --v900:#1a0936; --v800:#2c1259; --v700:#43208a; --v500:#7a47d1;
  --edge:rgba(210,185,255,.26);
  --gold-hi:#fff0a6; --gold:#ffc226; --amber:#ff9318; --amber-lo:#d96a0b; --on-gold:#2a0c52;
  --gold-grad:linear-gradient(165deg,#fff0a6 0%,#ffcf3a 22%,#ff9f1c 55%,#ffb92e 78%,#e8830f 100%);
  --panel:linear-gradient(160deg,rgba(139,92,214,.34) 0%,rgba(58,24,116,.62) 45%,rgba(30,10,64,.8) 100%);
  --r:20px; --r-s:14px;
  --f-display:"Sora","Cairo",system-ui,sans-serif;
  --f-body:"Inter","Cairo",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--f-body);font-size:16px;line-height:1.6;color:var(--ink);
  background-color:var(--v900);
  background-image:
    radial-gradient(900px 520px at 12% -8%,rgba(150,100,235,.55),transparent 62%),
    radial-gradient(800px 600px at 100% 12%,rgba(95,45,175,.6),transparent 58%),
    linear-gradient(180deg,#2a1058 0%,#170733 55%,#0f0520 100%);
  background-repeat:no-repeat;
  min-height:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#190a35}
html[lang="ar"] body{font-family:"Cairo",var(--f-body);line-height:1.8}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;font-weight:700;text-wrap:balance}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:"Cairo",var(--f-display);line-height:1.4}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold-hi);outline-offset:3px;border-radius:8px}
.wrap{max-width:1080px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(25,10,53,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--edge)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 4px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
.badge{flex:none;width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 2px var(--gold),0 8px 20px -8px rgba(255,160,30,.6)}
.badge img{height:40px;width:auto;display:block}
.brand-t{display:flex;flex-direction:column;min-width:0}
.brand-t strong{font-family:var(--f-display);font-size:1.15rem;letter-spacing:.01em}
html[lang="ar"] .brand-t strong{font-family:"Cairo",var(--f-display)}
.brand-t small{color:var(--ink-2);font-size:.78rem;line-height:1.3}
.lang{display:flex;gap:4px;padding:4px;border:1px solid var(--edge);border-radius:14px;background:rgba(15,5,32,.5)}
.lang button{font:inherit;font-size:.82rem;font-weight:600;color:var(--ink-2);background:none;border:0;padding:.35rem .7rem;border-radius:10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--gold-grad);color:var(--on-gold)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-block:8px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:.95rem;padding:.55rem 1.05rem;border-radius:12px;border:1px solid var(--edge);background:rgba(60,28,120,.35)}
.tab:hover{color:var(--ink);border-color:rgba(255,210,90,.55)}
.tab[aria-current="page"]{background:var(--gold-grad);color:var(--on-gold);border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(160,70,0,.3)}

/* shared */
.sec{padding-block:2.4rem 0}
.sec-head{display:flex;flex-direction:column;gap:.6rem;margin-bottom:1.5rem;max-width:62ch}
.sec-head h2{font-size:clamp(1.6rem,3.4vw,2.3rem)}
.sec-head p{color:var(--ink-2)}
.eyebrow{display:inline-block;align-self:flex-start;font-size:.78rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-hi);border:1px solid rgba(255,210,90,.45);border-radius:10px;padding:.25rem .65rem}
html[lang="ar"] .eyebrow{letter-spacing:0}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);padding:1.25rem;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 18px 40px -24px rgba(0,0,0,.8);min-width:0}
.panel h3{font-size:1.1rem;margin-bottom:.4rem}
.panel p{color:var(--ink-2);font-size:.97rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;font:inherit;font-weight:700;font-size:1rem;text-decoration:none;cursor:pointer;border:0;border-radius:16px;padding:.85rem 1.3rem;color:var(--on-gold);background:var(--gold-grad);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -2px 0 rgba(160,70,0,.35),0 12px 26px -12px rgba(255,150,20,.7)}
.btn:hover{filter:brightness(1.06)}
.btn svg{width:20px;height:20px;flex:none}
.btn.ghost{background:rgba(60,28,120,.45);color:var(--ink);box-shadow:none;border:1px solid var(--edge)}
.btn.ghost:hover{border-color:rgba(255,210,90,.6)}
.btn.small{font-size:.9rem;padding:.55rem .9rem;border-radius:12px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.ico{width:46px;height:46px;border-radius:14px;background:var(--gold-grad);color:var(--on-gold);display:grid;place-items:center;margin-bottom:.9rem;box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -2px 0 rgba(160,70,0,.3)}
.ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:2rem;align-items:center;padding-block:2.2rem 0}
.hero h1{font-size:clamp(2rem,5vw,3.3rem);margin:.9rem 0 1rem}
.hero p.lead{font-size:1.08rem;color:var(--ink-2);max-width:56ch;margin-bottom:1.5rem}
.logo-card{justify-self:center;width:min(100%,290px);background:#fff;border-radius:30px;padding:1.4rem;display:grid;place-items:center;border:3px solid var(--gold);box-shadow:0 0 0 6px rgba(255,194,38,.18),0 30px 60px -26px rgba(0,0,0,.9)}
.logo-card img{width:100%;height:auto;max-height:340px;object-fit:contain;display:block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:2.2rem}
.stat{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r-s);padding:1rem 1.1rem;box-shadow:inset 0 1px 0 rgba(255,255,255,.18);min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:clamp(1.5rem,4vw,2.1rem);line-height:1.15;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
html[lang="ar"] .stat b{font-family:"Cairo",var(--f-display)}
.stat span{color:var(--ink-2);font-size:.9rem}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px}
.step{display:flex;flex-direction:column;gap:.3rem}
.num{width:40px;height:40px;border-radius:12px;background:var(--gold-grad);color:var(--on-gold);font-weight:700;display:grid;place-items:center;margin-bottom:.6rem;font-family:var(--f-display);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.band{margin-top:2.6rem;border-radius:var(--r);padding:clamp(1.4rem,4vw,2.2rem);background:var(--gold-grad);color:var(--on-gold);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1.2rem;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(160,70,0,.3),0 24px 50px -28px rgba(255,150,20,.8)}
.band h2{font-size:clamp(1.3rem,3vw,1.8rem)}
.band p{margin-top:.3rem;max-width:48ch}
.band .btn{background:var(--v800);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 10px 22px -12px rgba(30,10,64,.9)}

/* accordion */
.accs{display:flex;flex-direction:column;gap:12px}
.acc{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r-s);box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 1.2rem;font-weight:600}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";flex:none;width:30px;height:30px;border-radius:10px;background:var(--gold-grad);color:var(--on-gold);display:grid;place-items:center;font-weight:700;font-size:1.2rem;line-height:1}
.acc[open] summary::after{content:"\2212"}
.acc p{padding:0 1.2rem 1.1rem;color:var(--ink-2);max-width:66ch}
.tag{display:inline-block;margin-top:.9rem;font-size:.8rem;color:var(--gold-hi);border:1px solid rgba(255,210,90,.4);border-radius:10px;padding:.2rem .6rem}

/* team / podcast / contact */
.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px;align-items:start}
.prose{display:flex;flex-direction:column;gap:1rem;color:var(--ink-2);max-width:62ch}
.vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.pod{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.4rem;align-items:center}
.play{width:92px;height:92px;border-radius:24px;background:var(--gold-grad);display:grid;place-items:center;color:var(--on-gold);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(160,70,0,.3)}
.play svg{width:38px;height:38px;fill:currentColor}
html[dir="rtl"] .play svg{transform:scaleX(-1)}
.pts{list-style:none;margin:1.2rem 0 0;padding:0;display:grid;gap:12px}
.pts li{display:flex;flex-direction:column;padding-inline-start:1rem;border-inline-start:3px solid var(--gold)}
.pts li b{font-weight:600}
.pts li span{color:var(--ink-2);font-size:.95rem}
.phone{display:flex;flex-direction:column;gap:.8rem}
.phone .lab{font-size:.85rem;color:var(--ink-3)}
.phone .nb{font-family:var(--f-display);font-size:clamp(1.4rem,4vw,1.8rem);font-weight:700;direction:ltr;unicode-bidi:isolate;text-align:start;user-select:text;-webkit-user-select:text}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:.8rem 0 1.1rem}
.chip{font:inherit;font-size:.92rem;font-weight:600;color:var(--ink-2);background:rgba(60,28,120,.45);border:1px solid var(--edge);border-radius:12px;padding:.5rem .9rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold-grad);color:var(--on-gold);border-color:transparent}
.field label{display:block;font-size:.88rem;color:var(--ink-3);margin-bottom:.35rem}
.field input{width:100%;font:inherit;color:var(--ink);background:rgba(15,5,32,.55);border:1px solid var(--edge);border-radius:12px;padding:.7rem .9rem}
.field input::placeholder{color:var(--ink-3)}
.field{margin-bottom:1.1rem}
.soc{display:flex;flex-wrap:wrap;gap:12px;margin-top:.9rem}
.soc a{text-decoration:none;display:flex;flex-direction:column;padding:.8rem 1rem;border-radius:14px;border:1px solid var(--edge);background:rgba(60,28,120,.4);min-width:0}
.soc a:hover{border-color:rgba(255,210,90,.6)}
.soc small{color:var(--ink-3)}
.soc strong{direction:ltr;unicode-bidi:isolate}

/* footer + fab */
footer{margin-top:3.5rem;border-top:1px solid var(--edge);padding-block:1.6rem 6rem;color:var(--ink-3);font-size:.9rem}
footer .f{display:flex;flex-wrap:wrap;justify-content:space-between;gap:1rem}
footer .nbs{direction:ltr;unicode-bidi:isolate}
.fab{position:fixed;z-index:30;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-end:max(16px,env(safe-area-inset-right,0px),env(safe-area-inset-left,0px))}
.fab .btn{padding:.9rem 1.2rem;box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -2px 0 rgba(160,70,0,.35),0 14px 30px -8px rgba(0,0,0,.7)}

@media (max-width:820px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .logo-card{order:-1;width:min(100%,220px)}
  .cols{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .pod{grid-template-columns:minmax(0,1fr)}
  .play{width:72px;height:72px;border-radius:20px}
  .brand-t small{display:none}
  .btn{width:100%}
  .fab .btn{width:auto}
  .row .btn.small{width:auto}
}
@media (prefers-reduced-motion:no-preference){
  .sec,.hero{animation:rise .35s ease-out both}
  @keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
}
</style>

var LANG="fr", PROJ=0, CITY="";
var $=function(s){return document.querySelector(s)};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
function get(o,path){return path.split(".").reduce(function(a,k){return a&&a[k]},o)}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function fill(id,arr,build){var c=document.getElementById(id);c.replaceChildren();arr.forEach(function(x,i){c.appendChild(build(x,i))})}

function waLink(msg){return "https://wa.me/"+WA+(msg?"?text="+encodeURIComponent(msg):"")}
function helperMsg(){
  var d=D[LANG],m=d.waMsg.replace("{p}",d.projects[PROJ]);
  var c=CITY.trim();if(c)m+=d.waCity.replace("{c}",c);
  return m;
}
function updateWa(){
  var d=D[LANG],g=waLink(d.waGreet);
  $$("[data-wa]").forEach(function(a){a.href=g});
  $("#waHelper").href=waLink(helperMsg());
}

function render(){
  var d=D[LANG];
  $$("[data-i18n]").forEach(function(e){var v=get(d,e.getAttribute("data-i18n"));if(v!=null)e.textContent=v});
  $$("[data-i18n-ph]").forEach(function(e){e.placeholder=get(d,e.getAttribute("data-i18n-ph"))});
  $$("[data-i18n-aria]").forEach(function(e){e.setAttribute("aria-label",get(d,e.getAttribute("data-i18n-aria")))});
  fill("stats",d.stats,function(s){var x=el("div","stat");x.appendChild(el("b",null,s.n));x.appendChild(el("span",null,s.l));return x});
  fill("forItems",d.forItems,function(s){var x=el("div","panel");x.appendChild(el("h3",null,s.t));x.appendChild(el("p",null,s.d));return x});
  fill("steps",d.steps,function(s,i){var x=el("div","panel step");x.appendChild(el("span","num",String(i+1)));x.appendChild(el("h3",null,s.t));x.appendChild(el("p",null,s.d));return x});
  fill("svc",d.svc,function(s,i){var x=el("article","panel");var ic=el("div","ico");ic.setAttribute("aria-hidden","true");ic.innerHTML=ICONS[i];x.appendChild(ic);x.appendChild(el("h3",null,s.t));x.appendChild(el("p",null,s.d));x.appendChild(el("span","tag",d.idealFor+" "+s.tag));return x});
  function acc(q,a){var x=el("details","acc");x.appendChild(el("summary",null,q));x.appendChild(el("p",null,a));return x}
  fill("faq",d.faq,function(s){return acc(s.q,s.a)});
  fill("tips",d.tips,function(s){return acc(s.t,s.d)});
  fill("vals",d.values,function(s){var x=el("div","panel");x.appendChild(el("h3",null,s.t));x.appendChild(el("p",null,s.d));return x});
  fill("podPts",d.podPts,function(s){var x=el("li");x.appendChild(el("b",null,s.t));x.appendChild(el("span",null,s.d));return x});
  fill("chips",d.projects,function(p,i){var b=el("button","chip",p);b.type="button";b.setAttribute("aria-pressed",i===PROJ?"true":"false");b.addEventListener("click",function(){PROJ=i;$$("#chips .chip").forEach(function(c,j){c.setAttribute("aria-pressed",j===PROJ?"true":"false")});updateWa()});return b});
  updateWa();
}

function setLang(l,save){
  LANG=l;
  var h=document.documentElement;h.setAttribute("lang",l);h.setAttribute("dir",l==="ar"?"rtl":"ltr");
  $$(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-lang")===l?"true":"false")});
  if(save){try{localStorage.setItem("ar-electric-lang",l)}catch(e){}}
  render();
}

function show(scroll){
  var id=location.hash.slice(1);if(TABS.indexOf(id)<0)id="accueil";
  $$("main > section").forEach(function(s){s.hidden=s.getAttribute("data-tab")!==id});
  $$(".tab").forEach(function(t){
    var on=t.getAttribute("data-tab")===id;
    if(on){t.setAttribute("aria-current","page");try{t.scrollIntoView({block:"nearest",inline:"center"})}catch(e){}}else t.removeAttribute("aria-current");
  });
  if(scroll)window.scrollTo(0,0);
}

$$("img[data-logo]").forEach(function(i){i.src=LOGO});
$$(".lang button").forEach(function(b){b.addEventListener("click",function(){setLang(b.getAttribute("data-lang"),true)})});
$("#city").addEventListener("input",function(e){CITY=e.target.value;updateWa()});
$$("[data-copy]").forEach(function(b){
  b.addEventListener("click",function(){
    var node=document.getElementById(b.getAttribute("data-copy")),txt=node.textContent.replace(/\s+/g,"");
    var label=b.querySelector("span");
    function done(){var o=label.textContent;label.textContent=D[LANG].copied;setTimeout(function(){label.textContent=D[LANG].copy},1600)}
    function fallback(){try{var r=document.createRange();r.selectNodeContents(node);var s=window.getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}}
    try{navigator.clipboard.writeText(txt).then(done,fallback)}catch(e){fallback()}
  });
});
window.addEventListener("hashchange",function(){show(true)});

var start="fr";try{start=localStorage.getItem("ar-electric-lang")||"fr"}catch(e){}
if(!D[start])start="fr";
setLang(start,false);
show(false);
})();
